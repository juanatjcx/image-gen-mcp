name: Manual published registry verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_GEN_LIVE: "false"
      RELEASE_HASH: fdafc22dc994edb23af7011cfad77e41a10f04bbd6d5c87a872fd7dd25a5e010
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_FETCH_RETRIES: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
      - name: Install verification dependencies without credentials
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify published artifact and fresh registry installation
        run: node scripts/verify-registry.mjs
